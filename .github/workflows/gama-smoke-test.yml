name: GAMA Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run the mobile runtime smoke test
        run: PYTHONPATH=. python3 -B tests/mobile_smoke_test.py
